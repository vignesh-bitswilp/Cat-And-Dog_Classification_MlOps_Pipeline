stages:
  # NOTE: There is deliberately no "download_data" DVC stage here.
  # Downloading requires per-user Kaggle credentials, so it's a manual
  # (or CI-secret-gated) one-time step rather than something `dvc repro`
  # can run unattended for every contributor. Run this once before
  # `dvc repro`:
  #
  #     python scripts/download_kaggle_data.py
  #     dvc add data/raw/cats data/raw/dogs
  #
  # `dvc add` versions the resulting images so `dvc repro` below can treat
  # data/raw/cats and data/raw/dogs as tracked, hashed dependencies.

  preprocess:
    cmd: python -m src.data_preprocessing
    deps:
      - data/raw/cats
      - data/raw/dogs
      - src/data_preprocessing.py
    outs:
      - data/processed/train
      - data/processed/val
      - data/processed/test
    desc: Splits raw Kaggle images into train/val/test (80/10/10) folders.

  train:
    cmd: python -m src.train --epochs 15 --batch-size 32
    deps:
      - data/processed/train
      - data/processed/val
      - data/processed/test
      - src/train.py
      - src/model.py
    outs:
      - models/model.pt
      - models/loss_curve.png
      - models/confusion_matrix.png
    desc: >
      Trains SimpleCNN and logs the run (params/metrics/artifacts) to
      MLflow. Run `mlflow ui --backend-store-uri sqlite:///mlflow.db`
      to inspect tracked experiments. Epoch count is higher than the
      earlier synthetic-data default since the real dataset needs more
      passes to converge -- adjust for your hardware/time budget.
