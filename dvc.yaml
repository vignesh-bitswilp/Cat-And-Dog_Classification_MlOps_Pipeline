stages:
  generate_data:
    cmd: python scripts/generate_synthetic_data.py
    outs:
      - data/raw/cats
      - data/raw/dogs
    desc: >
      Generates the synthetic dataset used for reproducible CI runs.
      Skip this stage (dvc.yaml supports overriding) and instead run
      `kaggle datasets download -d salader/dogs-vs-cats -p data/raw --unzip`
      to use the real Kaggle dataset -- see scripts/generate_synthetic_data.py
      docstring for details.

  preprocess:
    cmd: python -m src.data_preprocessing
    deps:
      - data/raw/cats
      - data/raw/dogs
      - src/data_preprocessing.py
    outs:
      - data/processed/train
      - data/processed/val
      - data/processed/test
    desc: Splits raw images into train/val/test (80/10/10) folders.

  train:
    cmd: python -m src.train --epochs 5 --batch-size 16
    deps:
      - data/processed/train
      - data/processed/val
      - data/processed/test
      - src/train.py
      - src/model.py
    outs:
      - models/model.pt
      - models/loss_curve.png
      - models/confusion_matrix.png
    desc: >
      Trains SimpleCNN and logs the run (params/metrics/artifacts) to
      MLflow. Run `mlflow ui --backend-store-uri sqlite:///mlflow.db`
      to inspect tracked experiments.
