name: CD - Deploy & Smoke Test

# Runs after CI succeeds on main, or can be triggered manually.
on:
  workflow_run:
    workflows: ["CI - Test, Build & Publish Image"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vignesh-bitswilp/cat-and-dog_classification_mlops_pipeline/cats-dogs-inference
  IMAGE_TAG: latest

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Deployment Target: local kind cluster (M4.1) ----
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cats-dogs-cluster

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- CD/GitOps flow: pull new image, load into cluster (M4.2) ----
      - name: Pull latest image from registry
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Load image into kind cluster
        run: kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --name cats-dogs-cluster

      - name: Substitute image reference in manifests
        run: |
          sed -i "s#IMAGE_PLACEHOLDER#${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}#g" k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/cats-dogs-inference --timeout=120s

      - name: Debug model and pod
        run: |
          echo "=== Pods ==="
          kubectl get pods

          echo "=== Pod logs ==="
          kubectl logs deployment/cats-dogs-inference --tail=200

          echo "=== Model check ==="
          POD=$(kubectl get pods -l app=cats-dogs-inference -o jsonpath='{.items[0].metadata.name}')
          kubectl exec "$POD" -- ls -lh /app/models/

      - name: Port-forward service for smoke testing
        run: |
          kubectl port-forward svc/cats-dogs-inference-svc 8000:80 &
          sleep 5

      # ---- Smoke Tests / Health Check (M4.3) ----
      - name: Install smoke test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow
      - name: Run smoke tests
        run: bash monitoring/smoke_test.sh http://localhost:8000

      - name: Fail pipeline if smoke tests failed
        if: failure()
        run: |
          echo "Smoke tests failed -- rolling back is recommended (kubectl rollout undo)."
          exit 1
