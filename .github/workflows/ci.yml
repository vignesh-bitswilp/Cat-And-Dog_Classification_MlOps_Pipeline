name: CI - Test, Build & Publish Image

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "src/**"
      - "app/**"
      - "models/**"
      - "requirements.txt"
      - "requirements-inference.txt"
      - "Dockerfile"
      - "tests/**"
      - "k8s/**"
      - "monitoring/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "app/**"
      - "models/**"
      - "requirements.txt"
      - "requirements-inference.txt"
      - "Dockerfile"
      - "tests/**"
      - "k8s/**"
      - "monitoring/**"
      - ".github/workflows/ci.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vignesh-bitswilp/cat-and-dog_classification_mlops_pipeline/cats-dogs-inference

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Python setup
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ---------------------------------------------------------
      # Install test dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------
      # Unit tests
      # ---------------------------------------------------------
      - name: Run unit tests
        run: pytest tests/ -v

      # ---------------------------------------------------------
      # Verify trained model exists
      #
      # model.pt is committed to Git because it is only ~1.7 MB.
      # This check happens BEFORE the expensive Docker build.
      # ---------------------------------------------------------
      - name: Verify trained model exists
        run: |
          echo "Checking trained model artifact..."
          ls -lh models/
          test -f models/model.pt
          echo "model.pt found successfully."

      # ---------------------------------------------------------
      # Docker Buildx
      # ---------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # Login to GitHub Container Registry
      # ---------------------------------------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Docker image metadata
      # ---------------------------------------------------------
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest

      # ---------------------------------------------------------
      # Build and publish Docker image
      # ---------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # GitHub Actions BuildKit cache
          cache-from: type=gha
          cache-to: type=gha,mode=max