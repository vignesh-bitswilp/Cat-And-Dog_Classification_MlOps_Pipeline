name: CI - Test, Build & Publish Image

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cats-dogs-inference

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ---- Checkout repository (M3.2) ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Install dependencies (M3.2) ----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- Produce a tiny model artifact so tests/image build have something
      #      to package. On a real dataset this step is replaced by
      #      `dvc pull` + `dvc repro` against a full training run. ----
      - name: Generate synthetic data & train a smoke-test model
        run: |
          python scripts/generate_synthetic_data.py
          python -m src.data_preprocessing
          MLFLOW_TRACKING_URI="sqlite:///mlflow.db" python -m src.train --epochs 2 --batch-size 16

      # ---- Run unit tests (M3.1) ----
      - name: Run unit tests
        run: pytest tests/ -v

      # ---- Build Docker image (M3.2) ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            latest

      # ---- Build and (on push) publish image (M3.3: Artifact Publishing) ----
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
