name: CI - Test, Build & Publish Image

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vignesh-bitswilp/cat-and-dog_classification_mlops_pipeline/cats-dogs-inference

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ---- Checkout repository (M3.2) ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Install dependencies (M3.2) ----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- Run unit tests (M3.1) ----
      # These tests don't require the real Kaggle dataset or a trained
      # model: preprocessing tests use in-memory PIL images, and the
      # inference-utility tests exercise an untrained model's I/O
      # plumbing (shapes/schema/determinism), not classification accuracy.
      - name: Run unit tests
        run: pytest tests/ -v

      # ---- Pull the versioned, already-trained model artifact (M1) ----
      # Training on the full Kaggle dataset is a deliberately separate,
      # manual/on-demand step (see README "Training the model") rather
      # than something every push re-runs. CI instead pulls the model
      # artifact that a prior `dvc repro && dvc push` produced, so the
      # Docker image below bakes in a real, already-trained model.
      #
      # Requires a DVC remote to be configured (see README) and its
      # credentials added as repo secrets, e.g. for an S3 remote:
      #   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
      - name: Pull trained model artifact via DVC
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          dvc pull models/model.pt || echo "No DVC remote configured yet -- skipping pull. Configure one before relying on this step (see README)."

      # ---- Build Docker image (M3.2) ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            latest,value=latest

      # ---- Build and (on push) publish image (M3.3: Artifact Publishing) ----
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
